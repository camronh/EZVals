[project]
name = "ezvals"
version = "0.2.0"
description = "A lightweight, code-first evaluation framework for testing AI agents and LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["evaluation", "llm", "agents", "testing", "benchmark", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
ezvals = "ezvals.cli:main"

[project.urls]
Homepage = "https://github.com/camronh/EZVals"
Repository = "https://github.com/camronh/EZVals"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "playwright>=1.56.0",
    "pytest-playwright>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ezvals"]
artifacts = ["ezvals/bin/*"]

[tool.hatch.build.targets.wheel.hooks.custom]

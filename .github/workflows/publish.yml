name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing: the workflow proves who it is, so no npm token is stored

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - uses: astral-sh/setup-uv@v6

      - name: Build host binaries, platform wheels and npm platform packages
        run: scripts/build_release.sh

      - name: Publish to PyPI
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to npm
        # Trusted publishing needs npm 11.5.1 or later.
        run: npm install -g npm@latest && scripts/publish_npm.sh
